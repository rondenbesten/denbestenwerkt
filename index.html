    <style>

<body>
    <header>
        <div><img src="denbestenwerkt-logo.png" alt="" width="371" height="142" class="logo"></div>
        <h1>Digital solutions</h1>

        <h2>Den Besten VOF</h2>

        <div class="content">
            <div class="content-box content-box--start">
                <div class="content-item">KvK: 08065209</div>
                <div class="content-item">BTW: NL8056.80.846B01</div>
            </div>
            <div class="content-box content-box--end">
                <div class="content-item"><a class="link" id="emailLink" href="#" onclick="sendEmail()"></a></div>
            </div>
        </div>

    </header>


    <script>
        function encodeEmail(email) {
            return email
                .split('')
                .map(char => `&#${char.charCodeAt(0)};`)
                .join('');
        }

        function sendEmail() {
            const parts = ['mai', 'lto', ':', 'ron', '@', 'denbestenwerkt', '.', 'com'];
            const emailLink = parts.join('');
            window.location.href = emailLink;
        }

        document.addEventListener("DOMContentLoaded", function () {
            const emailParts = ['ron', '@', 'denbestenwerkt', '.', 'com'];
            const emailText = encodeEmail(emailParts.join('')); // Encode het e-mailadres
            document.getElementById('emailLink').innerHTML = emailText; // Voeg de gecodeerde tekst toe
        });
    </script>

</body>
